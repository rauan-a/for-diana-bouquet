<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Дианы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
:root{color-scheme:dark;--bg:#07070a;--fg:#f6eec8;--mut:#9a9482;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden}
h1{font-style:italic;font-weight:500;font-size:clamp(28px,7vw,52px);margin:0;text-align:center;padding:0 16px;opacity:0;transition:opacity 2s}
#msg{min-height:1.4em;font-size:clamp(18px,4.5vw,26px);font-style:italic;text-align:center;padding:0 20px;color:var(--mut)}
canvas{width:min(94vw,640px);height:auto;display:block}
button{background:none;border:1px solid var(--mut);color:var(--mut);padding:8px 20px;border-radius:99px;font:inherit;font-size:16px;cursor:pointer}
button:hover{color:var(--fg);border-color:var(--fg)}
</style>
</head>
<body>
<h1 id="title"></h1>
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="replay">Расцвести снова</button>

<script>
/* ===== НАСТРОЙКИ ===== */
const NAME = "Диана";
const MESSAGE = "Пусть у тебя всегда всё расцветает ✿";
/* ===================== */

const COLS = 110, ROWS = 72, LW = 100, LH = 130;
const RAMP = " .,:;-~=+*x#%@";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const off = document.createElement("canvas"); off.width = COLS; off.height = ROWS;
const o = off.getContext("2d", { willReadFrequently: true });

let CW = 6, CH = 12;
function resize() {
  const w = Math.min(window.innerWidth * 0.94, 640), d = window.devicePixelRatio || 1;
  CW = w / COLS; CH = CW * 2;
  cv.width = Math.round(COLS * CW * d); cv.height = Math.round(ROWS * CH * d);
  cv.style.width = w + "px";
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.font = `bold ${CW * 1.75}px "Courier New",monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
}
addEventListener("resize", resize); resize();

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - t, 3);
const BASE = { x: 50, y: 120 };

// цветок: центр, радиус, поворот, цвет, наклон
const flowers = [
  { x: 52, y: 36, r: 22, rot: 0.2, col: "#e02a35", tilt: 0.85 },
  { x: 30, y: 62, r: 20, rot: 0.5, col: "#d655c0", tilt: 0.8 },
  { x: 66, y: 66, r: 24, rot: 0.1, col: "#f1e2cc", tilt: 0.75 },
  { x: 76, y: 38, r: 16, rot: 0.9, col: "#e8c23a", tilt: 0.8 },
  { x: 36, y: 28, r: 15, rot: 0.3, col: "#f5f0f0", tilt: 0.8 },
  { x: 18, y: 82, r: 15, rot: 0.7, col: "#efc335", tilt: 0.7 },
  { x: 48, y: 88, r: 19, rot: 0.4, col: "#eaa070", tilt: 0.7 },
  { x: 84, y: 88, r: 14, rot: 0.2, col: "#b01c2c", tilt: 0.7 },
  { x: 62, y: 18, r: 12, rot: 0.6, col: "#c8579a", tilt: 0.8 },
];
flowers.forEach((f, i) => {
  f.cx = (BASE.x + f.x) / 2 + (f.x < 50 ? -8 : 8); // изгиб стебля
  f.cy = (BASE.y + f.y) / 2 + 12;
  f.delay = 2.2 + i * 0.45;
});

const leaves = [
  [34, 110, -2.4, 26], [66, 110, -0.7, 26], [45, 112, -1.9, 22],
  [56, 112, -1.2, 22], [26, 104, -2.7, 20], [74, 104, -0.4, 20],
];

function mix(hex, k) { // k>0 светлее, k<0 темнее
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = k < 0 ? 0 : 255, a = Math.abs(k);
  r = Math.round(r + (t - r) * a); g = Math.round(g + (t - g) * a); b = Math.round(b + (t - b) * a);
  return `rgb(${r},${g},${b})`;
}

function qpt(p0, c, p1, t) {
  const u = 1 - t;
  return { x: u * u * p0.x + 2 * u * t * c.x + t * t * p1.x, y: u * u * p0.y + 2 * u * t * c.y + t * t * p1.y };
}

function petal(L, W, col, ang) {
  o.save(); o.rotate(ang);
  const g = o.createLinearGradient(0, 0, L, 0);
  g.addColorStop(0, "#f0d040"); g.addColorStop(0.18, mix(col, -0.35));
  g.addColorStop(0.65, col); g.addColorStop(1, mix(col, 0.35));
  o.fillStyle = g;
  o.beginPath(); o.moveTo(0, 0);
  o.bezierCurveTo(L * 0.3, -W * 1.3, L * 0.8, -W * 0.9, L, 0);
  o.bezierCurveTo(L * 0.8, W * 0.9, L * 0.3, W * 1.3, 0, 0);
  o.fill();
  o.strokeStyle = mix(col, -0.45); o.globalAlpha = 0.6; o.lineWidth = 0.7;
  o.beginPath(); o.moveTo(L * 0.05, 0); o.lineTo(L * 0.85, 0); o.stroke();
  o.globalAlpha = 1; o.restore();
}

function drawFlower(f, b) {
  if (b <= 0) return;
  const L = f.r * (0.3 + 0.7 * b), W = f.r * (0.2 + 0.2 * b);
  o.save(); o.translate(f.x, f.y); o.scale(1, f.tilt * (0.55 + 0.45 * b)); o.rotate(f.rot);
  for (let k = 0; k < 3; k++) petal(L * 0.9, W, mix(f.col, -0.2), k * 2.094 + 0.5 + b * 0.3);
  for (let k = 0; k < 3; k++) petal(L, W * 1.05, f.col, k * 2.094 - 0.1 + b * 0.2 * (k - 1));
  // тычинки
  if (b > 0.5) {
    const s = clamp((b - 0.5) * 2);
    for (let k = 0; k < 5; k++) {
      const a = -1 + k * 0.5, l = L * 0.62 * s;
      o.strokeStyle = "#e8d890"; o.lineWidth = 0.6;
      o.beginPath(); o.moveTo(0, 0); o.lineTo(Math.cos(a) * l, Math.sin(a) * l); o.stroke();
      o.fillStyle = "#c0561e";
      o.beginPath(); o.arc(Math.cos(a) * l, Math.sin(a) * l, 1.4, 0, 6.3); o.fill();
    }
  }
  o.restore();
}

function render(t) {
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.clearRect(0, 0, COLS, ROWS);
  o.setTransform(COLS / LW, 0, 0, ROWS / LH, 0, 0);
  o.lineCap = "round";

  // стебли
  flowers.forEach((f, i) => {
    const g = ease(clamp((t - i * 0.18) / 2));
    if (g <= 0) return;
    o.strokeStyle = "#3d9a3a"; o.lineWidth = 2;
    o.beginPath(); o.moveTo(BASE.x, BASE.y);
    for (let s = 1; s <= 24; s++) { const p = qpt(BASE, { x: f.cx, y: f.cy }, f, (s / 24) * g); o.lineTo(p.x, p.y); }
    o.stroke();
  });
  // листья
  leaves.forEach((l, i) => {
    const g = ease(clamp((t - 0.8 - i * 0.2) / 1.6));
    if (g <= 0) return;
    o.save(); o.translate(l[0], l[1]); o.rotate(l[2]);
    const L = l[3] * g, gr = o.createLinearGradient(0, 0, L, 0);
    gr.addColorStop(0, "#1f6a2a"); gr.addColorStop(1, "#6fd05a");
    o.fillStyle = gr; o.beginPath(); o.moveTo(0, 0);
    o.quadraticCurveTo(L * 0.5, -5 * g, L, 0); o.quadraticCurveTo(L * 0.5, 5 * g, 0, 0); o.fill();
    o.restore();
  });
  // цветы (сзади — вперёд)
  [...flowers].sort((a, b) => a.y - b.y).forEach(f => {
    drawFlower(f, ease(clamp((t - f.delay) / 3.2)));
  });
}

const stars = Array.from({ length: 70 }, () => ({ c: Math.random() * COLS | 0, r: Math.random() * ROWS | 0, p: Math.random() * 6 }));
let t0 = performance.now(), last = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 33) return; last = now;
  const t = (now - t0) / 1000;
  render(t);
  const d = o.getImageData(0, 0, COLS, ROWS).data;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#07070a"; ctx.fillRect(0, 0, COLS * CW, ROWS * CH);

  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.35 * Math.abs(Math.sin(t * 1.3 + s.p))})`;
    ctx.fillText(".", (s.c + 0.5) * CW, (s.r + 0.5) * CH);
  }
  const wob = Math.sin(t * 1.2) * 0.4;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = (y * COLS + x) * 4, a = d[i + 3];
      if (a < 40) continue;
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      let idx = Math.floor(l * 1.15 * RAMP.length);
      if ((x * 7 + y * 13 + (t * 3 | 0)) % 11 === 0) idx += 1; // мерцание символов
      idx = clamp(idx, 1, RAMP.length - 1);
      const k = 1.25;
      ctx.fillStyle = `rgb(${Math.min(255, r * k)},${Math.min(255, g * k)},${Math.min(255, b * k)})`;
      ctx.fillText(RAMP[idx], (x + 0.5 + wob * (1 - y / ROWS) * 0.2) * CW, (y + 0.5) * CH);
    }
  }
  if (t > 9 && !typed) typeMsg();
  if (t > 6) document.getElementById("title").style.opacity = 1;
}

let typed = false, timer;
function typeMsg() {
  typed = true; const el = document.getElementById("msg"); let i = 0;
  timer = setInterval(() => { el.textContent = MESSAGE.slice(0, ++i); if (i >= MESSAGE.length) clearInterval(timer); }, 70);
}
document.getElementById("title").textContent = "Для " + NAME + " 🌸";
document.getElementById("replay").onclick = () => {
  clearInterval(timer); typed = false; t0 = performance.now();
  document.getElementById("msg").textContent = "";
  document.getElementById("title").style.opacity = 0;
};
requestAnimationFrame(frame);
</script>
</body>
</html>
